name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: npm ci
      - run: npm test
      - run: go test -race -count=1 ./... && go vet ./...
        working-directory: runner
      - run: npm run build
      - name: Verify official Komari runtime
        run: |
          curl --fail --location https://github.com/komari-monitor/komari/releases/download/1.6.1/komari-linux-amd64 -o "$RUNNER_TEMP/komari"
          chmod +x "$RUNNER_TEMP/komari"
          curl --fail --location https://github.com/DeserveL/komari-webdav-backup/releases/download/v0.1.1/komari-webdav-backup-0.1.1.zip -o "$RUNNER_TEMP/previous.zip"
          KOMARI_EXE="$RUNNER_TEMP/komari" KOMARI_PREVIOUS_PACKAGE="$RUNNER_TEMP/previous.zip" node scripts/smoke-komari.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: komari-webdav-backup
          path: release/*
