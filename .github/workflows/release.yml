name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: npm ci
      - run: npm test
      - run: go test -race -count=1 ./... && go vet ./...
        working-directory: runner
      - name: Verify release version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm run build
      - name: Verify official Komari runtime
        run: |
          curl --fail --location https://github.com/komari-monitor/komari/releases/download/1.6.1/komari-linux-amd64 -o "$RUNNER_TEMP/komari"
          chmod +x "$RUNNER_TEMP/komari"
          curl --fail --location https://github.com/DeserveL/komari-webdav-backup/releases/download/v0.2.0/komari-webdav-backup-0.2.0.zip -o "$RUNNER_TEMP/previous.zip"
          KOMARI_EXE="$RUNNER_TEMP/komari" KOMARI_PREVIOUS_PACKAGE="$RUNNER_TEMP/previous.zip" node scripts/smoke-komari.mjs
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const text=fs.readFileSync("CHANGELOG.md","utf8"); fs.writeFileSync("release-notes.md",text.split(/^## /m)[1].replace(/^[^\n]*\n/,""));'
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
